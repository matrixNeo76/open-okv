    <script>
      // Filter out benign Vite HMR websocket reconnection errors in development sandbox
      window.addEventListener('unhandledrejection', function(event) {
        if (
          event.reason &&
          (typeof event.reason === 'string'
            ? event.reason.includes('WebSocket') || event.reason.includes('vite')
            : event.reason.message?.includes('WebSocket') ||
              event.reason.message?.includes('ws:') ||
              event.reason.message?.includes('failed to connect') ||
              event.reason.toString?.().includes('WebSocket'))
        ) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
    </script>
